[package]
name = "lychgated"
description = "Control-plane daemon for the lychgate break-glass access orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Treat configured secret files as TPM-sealed blobs, unsealed at startup via
# --tpm-unseal. Off by default so default builds never pull the C TSS stack.
# FreeBSD needs tpm-seal-bindgen (libclang via LIBCLANG_PATH).
tpm-seal = ["dep:lychgate-tpm", "lychgate-tpm/tss"]
tpm-seal-bindgen = ["tpm-seal", "lychgate-tpm/bindgen"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
lychgate-core = { workspace = true }
lychgate-wire = { workspace = true, features = ["std"] }
# base64url ledger keys for the FIDO2 counter ledger.
data-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The shared TPM plumbing — only compiled under the tpm-seal feature.
lychgate-tpm = { workspace = true, optional = true }

[dev-dependencies]
lychgate-core = { workspace = true, features = ["fakes"] }
# The simulated-users tier signs real SSHSIG proofs in-process.
ssh-key = { workspace = true }
