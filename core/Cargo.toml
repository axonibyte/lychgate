[package]
name = "lychgate-core"
description = "Grant state machine, TTL policy, and inventory schema for lychgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Exposes the scripted fake drivers to other crates' test suites (the
# daemon's lifecycle tests). Never enabled by a release dependency.
fakes = []

[dependencies]
serde = { workspace = true }
# Production since M2: the wire protocol is JSON.
serde_json = { workspace = true }
toml = { workspace = true }
# Approval verification (M8): SSHSIG + ed25519 verify, base64url codecs. Pure
# verification lives in core; the daemon supplies the configured key material.
ssh-key = { workspace = true }
data-encoding = { workspace = true }
# TOTP (M8a.3): HMAC-SHA1 for RFC 6238; the truncation is ours and KAT'd.
hmac = { workspace = true }
sha1 = { workspace = true }
# Password (M8a.4): Argon2id hash + constant-time verify.
argon2 = { workspace = true }
# FIDO2 (M8a.5): WebAuthn assertion verify + software authenticator.
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
