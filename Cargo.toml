[workspace]
resolver = "2"
members = ["core", "cli", "daemon", "mcp"]

[workspace.package]
version = "0.10.0"
edition = "2021"
# The floor, not the pin: the oldest toolchain the workspace is proven on
# (FreeBSD 15.1's pkg rust, 1.96). CI builds pin rust:1.97 in
# bitbucket-pipelines.yml; bump that deliberately and this only when the
# floor genuinely rises.
rust-version = "1.96"
license = "BSD-2-Clause"
authors = ["Axonibyte Innovations, LLC"]
repository = "https://bitbucket.org/axonibyte/lychgate"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Approval crypto (M8): SSHSIG parse + ed25519 verify (reusing operators' ssh
# keys), and base64url for the challenge/token codecs. Vetted RustCrypto; no
# hand-rolled crypto. Kept lean — only the ed25519 signature type is enabled.
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std"] }
data-encoding = "2"
# TOTP (M8a.3, RFC 6238): HMAC-SHA1 from RustCrypto. The RFC 4226 truncation is
# ours (and KAT'd); the crypto is the crate's. No hand-rolled crypto.
hmac = "0.12"
sha1 = "0.10"
# Password (M8a.4): Argon2id password-at-rest hashing + constant-time verify.
# Vetted RustCrypto; the KDF and the compare are the crate's.
argon2 = "0.5"
# FIDO2 (M8a.5): WebAuthn assertion verify (and a software authenticator).
# ES256 = ECDSA-P256 (p256), EdDSA = Ed25519 (ed25519-dalek, already resolved via
# ssh-key), SHA-256 for the signed message. Vetted RustCrypto; no hand-rolled
# crypto. The hardware CTAP2/HID stack is a separate, feature-gated CLI dep.
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
sha2 = "0.10"
lychgate-core = { path = "core" }
