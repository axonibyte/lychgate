[workspace]
resolver = "2"
members = ["core", "cli", "daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "BSD-2-Clause"
authors = ["Axonibyte Innovations, LLC"]
repository = "https://bitbucket.org/axonibyte/lychgate"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lychgate-core = { path = "core" }
