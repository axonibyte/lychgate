# Pinned rather than :latest so a tag build today and a rebuild next year use
# the same compiler. Bump deliberately, together with rust-version in
# Cargo.toml and the nightly pin in ci/build-target.sh.
image: rust:1.97

definitions:
  caches:
    cargo:
      key:
        files:
          - Cargo.lock
      path: .cargo_cache

  steps:
    - step: &doMirror
        name: Mirror repository
        clone:
          enabled: false
        script:
          - git clone --mirror git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git
          - cd ${BITBUCKET_REPO_SLUG}.git
          - git push --mirror git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

    - step: &doFetchAndTest
        name: Fetch dependencies, lint and run tests
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - rustup component add rustfmt clippy
          # shellcheck is pinned like the compiler is (see the image comment
          # above): Debian's package moves under the unversioned image layers,
          # and a linter that drifts fails tag builds of history that was clean
          # when pushed. Same version as the dev workstation.
          - curl -sSL -o /tmp/shellcheck.txz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          - echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.txz" | sha256sum -c -
          - tar -xJf /tmp/shellcheck.txz -C /tmp && install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          - cargo fetch --locked
          # The repository is kept fmt-clean and clippy-clean; the gate is what
          # keeps it that way.
          - cargo fmt --check
          - cargo clippy --workspace --all-targets --locked -- -D warnings
          - cargo test --workspace --release --locked
          # lychgate-wire ships in firmware: prove its no_std claim against the
          # real embedded target (rust-std only; cargo check links nothing).
          - rustup target add riscv32imc-unknown-none-elf
          - cargo check -p lychgate-wire -p lychgate-embed --no-default-features --target riscv32imc-unknown-none-elf --locked
          # The reference firmware (its own excluded workspace, own lockfile):
          # compile the riscv app and host-test its pure logic crate.
          - cargo check --manifest-path firmware/esp32c3/Cargo.toml --target riscv32imc-unknown-none-elf --locked
          - cargo check --manifest-path firmware/esp32c3/Cargo.toml --target riscv32imc-unknown-none-elf --features se --locked
          - cargo test --manifest-path firmware/esp32c3/Cargo.toml -p lychgate-esp32c3-logic --target x86_64-unknown-linux-gnu --locked
          # The tier-A C library: host-run the shared-vector KATs and prove
          # every object compiles for the ATmega328p.
          - apt-get -qq update && apt-get -qq install -y gcc-avr avr-libc
          - make -C avr test avr-check
          # The FPGA gate: simulate and run the sim-level oracle self-test.
          # (Debian packages no SymbiYosys; the formal pair runs on sby hosts
          # — a named narrowing, see TESTING.md.)
          - apt-get -qq install -y iverilog
          - make -C fpga sim sim-mutation
          - shellcheck -x ci/build-target.sh tools/*.sh rc.d/lychgated e2e/*.sh
          - ./tools/install-service-test.sh

    - step: &buildLinuxAmd64
        name: Build x86_64-unknown-linux-gnu
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-unknown-linux-gnu

    - step: &buildLinuxArm64
        name: Build aarch64-unknown-linux-gnu
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh aarch64-unknown-linux-gnu

    - step: &buildLinuxArmv7
        name: Build armv7-unknown-linux-gnueabihf
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh armv7-unknown-linux-gnueabihf

    - step: &buildFreebsdAmd64
        name: Build x86_64-unknown-freebsd
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-unknown-freebsd

    - step: &buildFreebsdArm64
        name: Build aarch64-unknown-freebsd
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh aarch64-unknown-freebsd

    - step: &buildWindowsAmd64
        # The daemon manages sshd, authorized_keys and BMCs on unix hosts and
        # would be dead weight on Windows; the operator's workstation can be
        # anything, so the client ships there too.
        name: Build x86_64-pc-windows-gnu (client only)
        caches:
          - cargo
        artifacts:
          - dist/*
        script:
          - bash ci/build-target.sh x86_64-pc-windows-gnu

    - step: &doDeploy
        name: Deploy multi-target artifacts
        script:
          # The tag names the release; the workspace version names the files.
          # Refuse to publish artifacts whose names contradict the tag.
          - VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml)
          - test -n "${VERSION}"
          - |
            if [[ "${BITBUCKET_TAG}" != "v${VERSION}" ]]; then
              echo "tag ${BITBUCKET_TAG} does not match workspace version v${VERSION}" >&2
              exit 1
            fi
          - |
            for f in dist/*; do
              if [[ -f "$f" && "$f" != *.sha256 ]]; then
                echo "Uploading $f..."
                sha256sum "$f" | awk '{ print $1 }' > "${f}.sha256"
                curl -sS --fail-with-body \
                  -H "Authorization: Bearer ${BB_PUB_SECRET}" \
                  -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                  --form files=@"${f}" --form files=@"${f}.sha256"
                echo "Uploaded $f + checksum"
              fi
            done

pipelines:
  branches:
    main:
      - step: *doMirror
      - step: *doFetchAndTest
      - parallel: &buildAll
          steps:
            - step: *buildLinuxAmd64
            - step: *buildLinuxArm64
            - step: *buildLinuxArmv7
            - step: *buildFreebsdAmd64
            - step: *buildFreebsdArm64
            - step: *buildWindowsAmd64

    '{feature/**,bugfix/**,release/**,hotfix/**}':
      - step: *doMirror
      - step: *doFetchAndTest

    '**':
      - step: *doMirror

  tags:
    '**':
      - step: *doMirror
      - step: *doFetchAndTest
      - parallel: *buildAll
      - step: *doDeploy
