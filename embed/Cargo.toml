[package]
name = "lychgate-embed"
description = "no_std device-side grant engine: token acceptance, uptime-anchored TTL, seq anti-replay, and the line protocol behind three small HAL traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# std gates test conveniences only; every load-bearing rule is no_std, so any
# embedded Rust project (esp-hal, RP2040, STM32) consumes this with
# `default-features = false`, implements UptimeClock/SeqStore/Gate, and is a
# spec-conformant lychgate device. See docs/EMBEDDED.md "bring your own
# firmware".
default = ["std"]
std = ["lychgate-wire/std"]

[dependencies]
lychgate-wire = { workspace = true, default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false }
