# lychgate as a reaper tenant. Two guests: Ubuntu builds and unit-tests in
# the same pinned rust:1.97 image the Bitbucket pipeline uses, then runs the
# Tier-4 battery on the guest host (where a real sshd, cron and systemd
# live); FreeBSD builds, tests and runs everything natively, because FreeBSD
# is a first-class deployment target and must not be the platform nothing
# exercises. The FreeBSD template needs a Rust toolchain (pkg install rust)
# — a known template gap.

schema = 1
project = "lychgate"

[[guests]]
name = "freebsd-15.1"
exec = "host"

[[guests]]
name = "ubuntu-26.04"
exec = "container"
# docker.io/library/rust:1.97; matches the dev host toolchain and the CI image.
build = { image = "docker.io/library/rust@sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769" }
run = { exec = "host" }

# Shared defaults. CARGO_HOME/CARGO_TARGET_DIR must point at the declared
# caches or every loop rebuilds the world; the variables expand because these
# are shell commands (manifest `env` values never interpolate). No pipes in
# any cmd: /bin/sh on the Ubuntu guest is dash, and a pipe would report the
# right-hand side's status. --all-targets builds the binaries too — the
# host-exec battery runs them out of the target cache.
[build]
# The trailing windows-client check runs only where rustup can add the target's
# rust-std (the Ubuntu build container); the FreeBSD guest's pkg rust cannot, and
# says so loudly rather than skipping in silence. `cargo check` links nothing, so
# no mingw is needed — it catches unix-only APIs in the cli (which once shipped a
# whole milestone unseen because nothing pre-push compiled this target).
cmd = """
CARGO_HOME=$REAPER_CACHE_CARGO \
CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
cargo build --locked --workspace --all-targets && \
CARGO_HOME=$REAPER_CACHE_CARGO \
CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
cargo test --workspace --locked && \
if command -v rustup >/dev/null 2>&1; then \
  rustup target add x86_64-pc-windows-gnu riscv32imc-unknown-none-elf && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
  cargo check -p lychgate --target x86_64-pc-windows-gnu --locked && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
  cargo check -p lychgate-wire -p lychgate-embed --no-default-features \
    --target riscv32imc-unknown-none-elf --locked && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET/firmware \
  cargo check --manifest-path firmware/esp32c3/Cargo.toml \
    --target riscv32imc-unknown-none-elf --locked && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET/firmware \
  cargo check --manifest-path firmware/esp32c3/Cargo.toml \
    --target riscv32imc-unknown-none-elf --features se --locked && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET/firmware \
  cargo test --manifest-path firmware/esp32c3/Cargo.toml \
    -p lychgate-esp32c3-logic --target x86_64-unknown-linux-gnu --locked && \
  apt-get -qq update && apt-get -qq install -y libtss2-dev gcc-avr avr-libc && \
  make -C avr test avr-check && \
  CARGO_HOME=$REAPER_CACHE_CARGO \
  CARGO_TARGET_DIR=$REAPER_CACHE_TARGET \
  cargo build --locked -p lychgate -p lychgated \
    --features lychgate/tpm-client,lychgated/tpm-seal; \
else \
  echo "windows client + wire riscv32 checks + tpm feature build: no rustup on this guest; the Ubuntu container covers them"; \
fi"""
cache = ["cargo", "target"]

# The Tier-4 battery: ssh acceptance, revert-under-kill (with its sabotaged
# oracle self-test), and the rc/systemd service proof. Root on the guest.
[run]
cmd = "sh e2e/run.sh"

[sync]
# Built on the dev host for a different OS; rebuilt into the session cache
# anyway.
exclude = ["/target/"]

[reset]
datasets = ["state"]

[resources]
cores = 4
ram_gb = 8

[profiles.dev]
ttl = "2h"
warm_cache = true

[profiles.nightly]
ttl = "12h"
warm_cache = false
