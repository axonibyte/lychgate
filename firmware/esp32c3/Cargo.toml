# The reference ESP32-C3 firmware: a thin lychgate-embed integrator.
#
# Deliberately its own workspace (excluded from the repo root's): esp-hal's
# dependency tree must never enter the root Cargo.lock or `--workspace`
# clippy/test, and its release cadence is contained by this crate's OWN
# committed lockfile — upgrades are deliberate commits. CI compiles it with
# `cargo check --manifest-path firmware/esp32c3/Cargo.toml --locked` (the
# riscv32imc rust-std is already provisioned for lychgate-wire's check);
# flashing real hardware is the manual HIL tier (e2e/embedded-hardware.sh).
[workspace]
members = ["logic"]

[package]
name = "lychgate-esp32c3"
description = "reference lychgate device firmware for the ESP32-C3 (USB-Serial-JTAG transport)"
version = "0.13.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[features]
# The ATECC608 secure-element integration (SE-PUBKEY?/SE-SIGN): off by
# default so the base device needs no I2C wiring; HIL-verified with a real
# chip on GPIO2/GPIO3.
se = ["dep:sha2", "dep:data-encoding"]

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32c3", "unstable"] }
sha2 = { version = "0.10", default-features = false, optional = true }
data-encoding = { version = "2", default-features = false, optional = true }
esp-storage = { version = "0.7.0", features = ["esp32c3"] }
embedded-storage = "0.3"
lychgate-wire = { path = "../../wire", default-features = false }
lychgate-embed = { path = "../../embed", default-features = false }
lychgate-esp32c3-logic = { path = "logic" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
